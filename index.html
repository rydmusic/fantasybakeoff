<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy GBBO League</title>
    
    <style>
        /* --- GLOBAL THEME BASE --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #080C16; /* Dark navy background */
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* --- TAB NAVIGATION --- */
        .tabs-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Allows tabs to stack on small screens */
            gap: 15px;
            padding: 20px;
            background-color: #080C16;
            position: relative;
            z-index: 100;
        }

        .tab-btn {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 10px 20px;
            font-size: clamp(12px, 3vw, 16px);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-btn.active {
            color: #080C16;
            background: #E2FF26;
            border-color: #E2FF26;
        }

        .tab-content {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeInTab 0.5s ease;
            padding-bottom: 50px;
        }

        .tab-content.active {
            display: flex;
        }

        @keyframes fadeInTab {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- THE BAKER GRID DESIGN --- */
        .cast-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: center;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .cast-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            aspect-ratio: 1200 / 795; 
            background-color: #080C16;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .cast-tile {
            position: relative;
            background-image: url('https://www.scotsman.com/jpim-static/image/2026/09/08/7/06/Great-British-Bake-Off-Cast-Series-17-2026-Channel-4-Love-Productions-Patch-Dolan.jpeg?trim=0,0,0,0&crop=&width=1200&auto=webp&quality=75');
            background-size: 400% 300%;
            opacity: 0;
            transition: opacity 2.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
        }

        /* Jigsaw puzzle background positioning */
        .cast-tile:nth-child(1) { background-position: 0% 0%; }
        .cast-tile:nth-child(2) { background-position: 33.333% 0%; }
        .cast-tile:nth-child(3) { background-position: 66.666% 0%; }
        .cast-tile:nth-child(4) { background-position: 100% 0%; }
        
        .cast-tile:nth-child(5) { background-position: 0% 50%; }
        .cast-tile:nth-child(6) { background-position: 33.333% 50%; }
        .cast-tile:nth-child(7) { background-position: 66.666% 50%; }
        .cast-tile:nth-child(8) { background-position: 100% 50%; }
        
        .cast-tile:nth-child(9) { background-position: 0% 100%; }
        .cast-tile:nth-child(10) { background-position: 33.333% 100%; }
        .cast-tile:nth-child(11) { background-position: 66.666% 100%; }
        .cast-tile:nth-child(12) { background-position: 100% 100%; }

        .cast-tile.visible {
            opacity: 1;
        }

        /* Hover Overlay for Tab 1 */
        #tab-bakers .cast-tile::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(8, 12, 22, 0.7); 
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        #tab-bakers .cast-tile:hover::before { opacity: 1; }
        #tab-bakers .cast-tile:hover .baker-name {
            opacity: 1;
            transform: translateY(0);
        }

        .baker-name {
            position: relative;
            z-index: 2;
            color: #E2FF26; 
            font-size: clamp(10px, 2.5vw, 24px); 
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(15px); 
            transition: all 0.3s ease;
            pointer-events: none;
            text-align: center;
        }

        /* --- PREDICTION FORM (TAB 2) --- */
        .form-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-container h2 {
            text-align: center;
            color: #E2FF26;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .text-input {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .text-input:focus {
            border-color: #E2FF26;
        }

        .select-baker-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
        }

        .select-baker-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: white;
        }

        .select-baker-btn.selected {
            border-style: solid;
            border-color: #E2FF26;
            color: #E2FF26;
            font-weight: bold;
        }

        .submit-btn {
            background-color: #352BFF;
            color: white;
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #E2FF26;
            color: #080C16;
        }

        /* --- BAKER SELECTOR MODAL --- */
        #baker-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(8, 12, 22, 0.95);
            z-index: 10002;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #baker-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        #baker-modal h3 {
            color: #E2FF26;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        #baker-modal .cast-wrapper {
            max-width: 800px;
        }

        /* Always show names in the modal so they know who to tap on mobile */
        #baker-modal .cast-tile { opacity: 1; }
        #baker-modal .cast-tile::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(8, 12, 22, 0.5); 
            z-index: 1;
        }
        #baker-modal .cast-tile:hover::before { background-color: rgba(8, 12, 22, 0.2); }
        
        #baker-modal .baker-name {
            opacity: 1;
            transform: translateY(0);
            background: rgba(8, 12, 22, 0.8);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .modal-controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .modal-btn {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .modal-btn:hover { background: white; color: black; }

        /* --- LEADERBOARD REDESIGN (TAB 3) --- */
        .leaderboard-section {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }

        .leaderboard-section h2 {
            color: #E2FF26; 
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background-color: rgba(53, 43, 255, 0.3);
            color: #E2FF26;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* --- INTRO SEQUENCE & VIDEO OVERLAY --- */
        #intro-sequence {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000000;
            z-index: 10001; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        #gbbo-logo {
            max-width: 80%;
            max-height: 50vh;
            opacity: 0; 
            transition: opacity 1.5s ease-in-out; 
        }

        #enter-text {
            color: #ffffff;
            font-size: 24px;
            margin-top: 40px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; 
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        #enter-text:hover { color: #E2FF26; }
        .fade-in { opacity: 1 !important; }

        #video-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: black;
            z-index: 9999;
        }

        .hidden { display: none !important; }
        .video-container { width: 100%; height: 100%; position: relative; }
        #intro-video { pointer-events: none; }

        #black-fade-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 10000;
            opacity: 0;
            pointer-events: none; 
            transition: opacity 2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #black-fade-screen.active {
            opacity: 1;
            pointer-events: auto; 
        }

        #close-video-btn {
            background: transparent;
            color: #E2FF26;
            border: 2px solid #E2FF26;
            padding: 15px 40px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        #close-video-btn:hover {
            background: #E2FF26;
            color: black;
        }
        
        .abstract-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 100px;
            opacity: 0.8;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- Cinematic Intro Sequence -->
    <div id="intro-sequence">
        <img id="gbbo-logo" src="https://ic.c4assets.com/bips/10683838/08B3E439-97FF-4e5e-998b-cb45c11bf795.png?imformat=chrome" alt="GBBO Logo">
        <p id="enter-text">Click here to enter</p>
    </div>

    <!-- Video Overlay -->
    <div id="video-overlay" class="hidden">
        <div class="video-container">
            <div id="black-fade-screen">
                <button id="close-video-btn">Continue to Site</button>
            </div>
            <iframe id="intro-video" width="100%" height="100%" 
                src="https://drive.google.com/file/d/1Fb9ChUeBb8GPhjhE5Ij0XYGeQkLysrxI/preview" 
                frameborder="0" allow="autoplay; fullscreen" allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- Interactive Baker Selection Modal -->
    <div id="baker-modal">
        <h3 id="modal-title">Select Baker</h3>
        <div class="cast-wrapper">
            <div class="cast-grid" id="modal-grid">
                <!-- Javascript will populate this grid to match the main one -->
            </div>
        </div>
        <div class="modal-controls">
            <button class="modal-btn" id="modal-none-btn">Select None</button>
            <button class="modal-btn" id="modal-cancel-btn">Cancel</button>
        </div>
    </div>

    <!-- Abstract Icon decoration -->
    <svg class="abstract-icon" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="4">
        <path d="M 40 10 Q 10 10 10 40 Q 10 70 40 70 Q 70 70 70 40 Q 70 10 40 10 Z" />
        <path d="M 60 30 Q 30 30 30 60 Q 30 90 60 90 Q 90 90 90 60 Q 90 30 60 30 Z" />
    </svg>

    <!-- Header Navigation Tabs -->
    <nav class="tabs-nav">
        <button class="tab-btn active" data-target="tab-bakers">The Bakers</button>
        <button class="tab-btn" data-target="tab-choices">Make Your Choices</button>
        <button class="tab-btn" data-target="tab-league">League Table</button>
    </nav>

    <!-- Main App Container -->
    <main>
        
        <!-- TAB 1: Animated Baker Grid -->
        <div id="tab-bakers" class="tab-content active">
            <section class="cast-wrapper">
                <div class="cast-grid" id="main-cast-grid">
                    <!-- Top Row -->
                    <div class="cast-tile"><span class="baker-name">Clara</span></div>
                    <div class="cast-tile"><span class="baker-name">Connie</span></div>
                    <div class="cast-tile"><span class="baker-name">Gabe</span></div>
                    <div class="cast-tile"><span class="baker-name">Danni</span></div>
                    
                    <!-- Second Row -->
                    <div class="cast-tile"><span class="baker-name">Gary</span></div>
                    <div class="cast-tile"><span class="baker-name">Mo</span></div>
                    <div class="cast-tile"><span class="baker-name">Molly</span></div>
                    <div class="cast-tile"><span class="baker-name">Moyin</span></div>
                    
                    <!-- Third Row -->
                    <div class="cast-tile"><span class="baker-name">Nikki</span></div>
                    <div class="cast-tile"><span class="baker-name">Shannon</span></div>
                    <div class="cast-tile"><span class="baker-name">Tom</span></div>
                    <div class="cast-tile"><span class="baker-name">Yannis</span></div>
                </div>
            </section>
        </div>

        <!-- TAB 2: Make Your Choices (Form) -->
        <div id="tab-choices" class="tab-content">
            <div class="form-container">
                <h2>Week 1 Predictions</h2>
                
                <form id="prediction-form">
                    <div class="input-group">
                        <label for="player-name">Your Name</label>
                        <input type="text" id="player-name" class="text-input" placeholder="Enter your name" required>
                    </div>

                    <!-- Hidden inputs store the actual form data -->
                    <input type="hidden" id="technical" required>
                    <input type="hidden" id="star-baker" required>
                    <input type="hidden" id="leaving" required>
                    <input type="hidden" id="handshake">

                    <!-- Visual buttons trigger the modal -->
                    <div class="input-group">
                        <label>Technical Winner (3 pts)</label>
                        <button type="button" class="select-baker-btn" data-target-input="technical" data-label="Technical Winner">
                            Tap to select a baker...
                        </button>
                    </div>

                    <div class="input-group">
                        <label>Star Baker (5 pts)</label>
                        <button type="button" class="select-baker-btn" data-target-input="star-baker" data-label="Star Baker">
                            Tap to select a baker...
                        </button>
                    </div>

                    <div class="input-group">
                        <label>Who is leaving? (2 pts)</label>
                        <button type="button" class="select-baker-btn" data-target-input="leaving" data-label="Leaving">
                            Tap to select a baker...
                        </button>
                    </div>

                    <div class="input-group">
                        <label>Hollywood Handshake? (10 pts)</label>
                        <button type="button" class="select-baker-btn" data-target-input="handshake" data-label="Hollywood Handshake">
                            Tap to select a baker... (Optional)
                        </button>
                    </div>

                    <button type="submit" class="submit-btn">Submit Predictions</button>
                </form>
            </div>
        </div>

        <!-- TAB 3: League Table -->
        <div id="tab-league" class="tab-content">
            <section class="leaderboard-section">
                <h2>League Table</h2>
                <table id="league-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Points</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </section>
        </div>

    </main>

    <script>
        // --- Setup Modal Grid by cloning Main Grid ---
        const mainGrid = document.getElementById('main-cast-grid');
        const modalGrid = document.getElementById('modal-grid');
        modalGrid.innerHTML = mainGrid.innerHTML;

        // --- Tab Switching Logic ---
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));
                
                btn.classList.add('active');
                const targetId = btn.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });

        // --- Form Modal Picker Logic ---
        const modal = document.getElementById('baker-modal');
        const modalTitle = document.getElementById('modal-title');
        let activeInputId = null;
        let activeBtn = null;

        // Open modal when tapping a select button
        document.querySelectorAll('.select-baker-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                activeInputId = btn.getAttribute('data-target-input');
                activeBtn = btn;
                modalTitle.innerText = `Select ${btn.getAttribute('data-label')}`;
                modal.classList.add('active');
            });
        });

        // Handle Baker Selection from Modal
        modalGrid.querySelectorAll('.cast-tile').forEach(tile => {
            tile.addEventListener('click', () => {
                const bakerName = tile.querySelector('.baker-name').innerText;
                
                // Update hidden input
                document.getElementById(activeInputId).value = bakerName;
                
                // Update button UI
                activeBtn.innerText = bakerName;
                activeBtn.classList.add('selected');
                
                // Close modal
                modal.classList.remove('active');
            });
        });

        // Modal Controls (None / Cancel)
        document.getElementById('modal-none-btn').addEventListener('click', () => {
            document.getElementById(activeInputId).value = "None";
            activeBtn.innerText = "None Selected";
            activeBtn.classList.remove('selected');
            modal.classList.remove('active');
        });

        document.getElementById('modal-cancel-btn').addEventListener('click', () => {
            modal.classList.remove('active');
        });

        // Handle Form Submission
        document.getElementById('prediction-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Check if mandatory visual fields are filled (since hidden inputs don't trigger native required UI well)
            const tech = document.getElementById('technical').value;
            const star = document.getElementById('star-baker').value;
            const leave = document.getElementById('leaving').value;
            
            if(!tech || !star || !leave || tech === "None" || star === "None" || leave === "None") {
                alert("Please select a baker for Technical, Star Baker, and Leaving.");
                return;
            }

            const playerName = document.getElementById('player-name').value;
            alert(`Predictions successfully saved for ${playerName}!`);
            
            // Reset form UI
            e.target.reset();
            document.querySelectorAll('.select-baker-btn').forEach(btn => {
                btn.innerText = "Tap to select a baker...";
                btn.classList.remove('selected');
            });
            document.querySelectorAll('input[type="hidden"]').forEach(input => input.value = "");
        });

        // --- Grid Animation Logic (Only targets Tab 1) ---
        function animateGrid() {
            const tiles = document.querySelectorAll('#tab-bakers .cast-tile');
            tiles.forEach((tile, index) => {
                setTimeout(() => {
                    tile.classList.add('visible');
                }, index * 400);
            });
        }

        // --- Intro Sequence & Video Timing Logic ---
        document.addEventListener("DOMContentLoaded", () => {
            const hasVisited = localStorage.getItem("gbbo_visited");
            
            const introSequence = document.getElementById("intro-sequence");
            const logo = document.getElementById("gbbo-logo");
            const enterText = document.getElementById("enter-text");
            
            const videoOverlay = document.getElementById("video-overlay");
            const blackFadeScreen = document.getElementById("black-fade-screen");
            const closeVideoBtn = document.getElementById("close-video-btn");
            const iframe = document.getElementById("intro-video");

            if (!hasVisited) {
                setTimeout(() => { logo.classList.add("fade-in"); }, 1000);
                setTimeout(() => { enterText.classList.add("fade-in"); }, 3000);

                enterText.addEventListener("click", () => {
                    introSequence.classList.add("hidden");
                    videoOverlay.classList.remove("hidden");
                    
                    const currentSrc = iframe.src;
                    if (!currentSrc.includes("autoplay=1")) {
                        iframe.src = currentSrc + "?autoplay=1";
                    }

                    setTimeout(() => {
                        blackFadeScreen.classList.add("active");
                    }, 20000); 
                });

                closeVideoBtn.addEventListener("click", () => {
                    videoOverlay.classList.add("hidden");
                    localStorage.setItem("gbbo_visited", "true"); 
                    iframe.src = ""; 
                    setTimeout(animateGrid, 300); 
                });

            } else {
                introSequence.classList.add("hidden");
                videoOverlay.classList.add("hidden");
                setTimeout(animateGrid, 300);
            }

            renderLeaderboard();
        });

        // --- Mock Data & Points Config ---
        let players = [
            { name: "Alice", score: 12 },
            { name: "Bob", score: 8 },
            { name: "Charlie", score: 18 },
            { name: "Dan", score: 5 }
        ];

        // --- Leaderboard Rendering ---
        function renderLeaderboard() {
            const tbody = document.getElementById("leaderboard-body");
            tbody.innerHTML = "";

            players.sort((a, b) => b.score - a.score);

            players.forEach((player, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${player.name}</td>
                    <td>${player.score}</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
