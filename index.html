<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy GBBO League</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf5e6;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .app-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            background-color: #e2a1c9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
        }

        form {
            display: flex;
            flex-direction: column;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        label {
            margin-top: 10px;
            font-weight: bold;
        }

        select, input, button {
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button[type="submit"] {
            margin-top: 20px;
            background-color: #7badd3;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button[type="submit"]:hover {
            background-color: #5a94bf;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #a3d9a5;
            color: white;
        }

        /* --- NEW INTRO SEQUENCE STYLES --- */
        #intro-sequence {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 10001; /* Must be above the video overlay */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        #gbbo-logo {
            max-width: 80%;
            max-height: 50vh;
            opacity: 0; 
            transition: opacity 1.5s ease-in-out; /* Smooth fade effect */
        }

        #enter-text {
            color: white;
            font-size: 24px;
            margin-top: 40px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* Smooth fade effect */
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        #enter-text:hover {
            color: #e2a1c9;
        }

        /* Class added via JavaScript to trigger the fade */
        .fade-in {
            opacity: 1 !important;
        }

        /* Video Overlay Styles */
        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #close-video-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.8);
            color: black;
            padding: 15px 30px;
            font-size: 20px;
            z-index: 10000;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        #close-video-btn:hover {
            background: white;
        }
    </style>
</head>
<body>

    <!-- Cinematic Intro Sequence -->
    <div id="intro-sequence">
        <img id="gbbo-logo" src="https://ic.c4assets.com/bips/10683838/08B3E439-97FF-4e5e-998b-cb45c11bf795.png?imformat=chrome" alt="GBBO Logo">
        <p id="enter-text">Click here to enter</p>
    </div>

    <!-- First Time Visitor Video Overlay -->
    <div id="video-overlay" class="hidden">
        <div class="video-container">
            <button id="close-video-btn">Go to Site</button>
            <iframe id="intro-video" width="100%" height="100%" 
                src="https://www.youtube.com/embed/VDiiDOl5CKs?enablejsapi=1" 
                frameborder="0" allow="autoplay; fullscreen" allowfullscreen>
            </iframe>
        </div>
    </div>

    <div class="app-container">
        <header>
            <h1>🧁 Fantasy Great British Bake Off 🧁</h1>
            <p>Make your weekly predictions and climb the leaderboard!</p>
        </header>

        <main>
            <!-- Prediction Form -->
            <section class="prediction-section">
                <h2>Week <span id="current-week">1</span> Predictions</h2>
                <form id="prediction-form">
                    <label for="player-name">Your Name:</label>
                    <input type="text" id="player-name" required placeholder="e.g., Paul H.">

                    <label for="technical">Technical Round Winner (3 pts):</label>
                    <select id="technical" required>
                        <option value="">Select a Baker...</option>
                        <option value="Baker 1">Baker 1</option>
                        <option value="Baker 2">Baker 2</option>
                        <option value="Baker 3">Baker 3</option>
                    </select>

                    <label for="star-baker">Star Baker (5 pts):</label>
                    <select id="star-baker" required>
                        <option value="">Select a Baker...</option>
                        <option value="Baker 1">Baker 1</option>
                        <option value="Baker 2">Baker 2</option>
                        <option value="Baker 3">Baker 3</option>
                    </select>

                    <label for="leaving">Who is leaving? (2 pts):</label>
                    <select id="leaving" required>
                        <option value="">Select a Baker...</option>
                        <option value="Baker 1">Baker 1</option>
                        <option value="Baker 2">Baker 2</option>
                        <option value="Baker 3">Baker 3</option>
                    </select>

                    <label for="handshake">Hollywood Handshake? (10 pts):</label>
                    <select id="handshake">
                        <option value="None">None</option>
                        <option value="Baker 1">Baker 1</option>
                        <option value="Baker 2">Baker 2</option>
                        <option value="Baker 3">Baker 3</option>
                    </select>

                    <button type="submit">Submit Predictions</button>
                </form>
            </section>

            <!-- League Table -->
            <section class="leaderboard-section">
                <h2>League Table</h2>
                <table id="league-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Points</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        // --- First Time Visitor Logic & Cinematic Intro ---
        document.addEventListener("DOMContentLoaded", () => {
            const hasVisited = localStorage.getItem("gbbo_visited");
            
            const introSequence = document.getElementById("intro-sequence");
            const logo = document.getElementById("gbbo-logo");
            const enterText = document.getElementById("enter-text");
            
            const videoOverlay = document.getElementById("video-overlay");
            const closeVideoBtn = document.getElementById("close-video-btn");
            const iframe = document.getElementById("intro-video");

            if (!hasVisited) {
                // 1. Wait 3 seconds, then fade in the logo
                setTimeout(() => {
                    logo.classList.add("fade-in");
                }, 3000);

                // 2. Wait an additional 2 seconds (5 seconds total), then fade in text
                setTimeout(() => {
                    enterText.classList.add("fade-in");
                }, 5000);

                // 3. User clicks text -> Hide Intro, Show Video, Autoplay Video
                enterText.addEventListener("click", () => {
                    introSequence.classList.add("hidden");
                    videoOverlay.classList.remove("hidden");
                    
                    // Appending autoplay to the src string forces it to play
                    iframe.src += "&autoplay=1"; 
                });

                // 4. User closes video to access the site
                closeVideoBtn.addEventListener("click", () => {
                    videoOverlay.classList.add("hidden");
                    localStorage.setItem("gbbo_visited", "true"); // Mark site as visited
                    iframe.src = ""; // Clear iframe source to stop audio playing in background
                });

            } else {
                // If they have visited before, skip the intro and video completely
                introSequence.classList.add("hidden");
                videoOverlay.classList.add("hidden");
            }

            renderLeaderboard();
        });

        // --- Points System Configuration ---
        const POINTS = {
            technical: 3,
            starBaker: 5,
            leaving: 2,
            handshake: 10
        };

        // Mock data for the league table
        let players = [
            { name: "Alice", score: 12 },
            { name: "Bob", score: 8 },
            { name: "Charlie", score: 18 }
        ];

        // --- Form Submission Logic ---
        const form = document.getElementById("prediction-form");

        form.addEventListener("submit", (e) => {
            e.preventDefault();

            const playerName = document.getElementById("player-name").value;
            
            const predictions = {
                technical: document.getElementById("technical").value,
                starBaker: document.getElementById("star-baker").value,
                leaving: document.getElementById("leaving").value,
                handshake: document.getElementById("handshake").value
            };

            alert(`Predictions saved for ${playerName}!`);
            form.reset();
        });

        // --- Leaderboard Logic ---
        function renderLeaderboard() {
            const tbody = document.getElementById("leaderboard-body");
            tbody.innerHTML = "";

            // Sort players by highest score
            players.sort((a, b) => b.score - a.score);

            players.forEach((player, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${player.name}</td>
                    <td>${player.score}</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
