<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy GBBO League</title>
    
    <style>
        /* --- GLOBAL THEME BASE --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #080C16; /* Dark navy background */
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- THE BAKER GRID DESIGN --- */
        .cast-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px; /* Constrains the image size */
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        /* Curved neon text overlay */
        .neon-heading {
            position: absolute;
            top: -60px;
            right: 0%;
            width: 400px;
            height: 400px;
            pointer-events: none;
            z-index: 10;
        }

        .cast-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            /* 1200x795 is roughly the aspect ratio of your image */
            aspect-ratio: 1200 / 795; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-color: #080C16;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* Each tile represents 1/12th of the image */
        .cast-tile {
            background-image: url('https://www.scotsman.com/jpim-static/image/2026/09/08/7/06/Great-British-Bake-Off-Cast-Series-17-2026-Channel-4-Love-Productions-Patch-Dolan.jpeg?trim=0,0,0,0&crop=&width=1200&auto=webp&quality=75');
            /* Zoom the background in so the full image spans 4 columns and 3 rows */
            background-size: 400% 300%;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        /* Shifting the background position to recreate the jigsaw puzzle */
        .cast-tile:nth-child(1) { background-position: 0% 0%; }
        .cast-tile:nth-child(2) { background-position: 33.333% 0%; }
        .cast-tile:nth-child(3) { background-position: 66.666% 0%; }
        .cast-tile:nth-child(4) { background-position: 100% 0%; }
        
        .cast-tile:nth-child(5) { background-position: 0% 50%; }
        .cast-tile:nth-child(6) { background-position: 33.333% 50%; }
        .cast-tile:nth-child(7) { background-position: 66.666% 50%; }
        .cast-tile:nth-child(8) { background-position: 100% 50%; }
        
        .cast-tile:nth-child(9) { background-position: 0% 100%; }
        .cast-tile:nth-child(10) { background-position: 33.333% 100%; }
        .cast-tile:nth-child(11) { background-position: 66.666% 100%; }
        .cast-tile:nth-child(12) { background-position: 100% 100%; }

        /* Class added by JS to trigger the fade */
        .cast-tile.visible {
            opacity: 1;
        }

        /* --- LEADERBOARD REDESIGN --- */
        .leaderboard-section {
            width: 100%;
            max-width: 600px;
        }

        .leaderboard-section h2 {
            color: #E2FF26; /* Neon yellow-green accent */
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background-color: rgba(53, 43, 255, 0.3);
            color: #E2FF26;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* --- INTRO SEQUENCE & VIDEO OVERLAY --- */
        #intro-sequence {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 10001; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        #gbbo-logo {
            max-width: 80%;
            max-height: 50vh;
            opacity: 0; 
            transition: opacity 1.5s ease-in-out; 
        }

        #enter-text {
            color: #ffffff;
            font-size: 24px;
            margin-top: 40px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; 
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        #enter-text:hover {
            color: #E2FF26;
        }

        .fade-in {
            opacity: 1 !important;
        }

        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
        }

        .hidden {
            display: none !important;
        }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #black-fade-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 10000;
            opacity: 0;
            pointer-events: none; 
            transition: opacity 2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #black-fade-screen.active {
            opacity: 1;
            pointer-events: auto; 
        }

        #close-video-btn {
            background: transparent;
            color: #E2FF26;
            border: 2px solid #E2FF26;
            padding: 15px 40px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        #close-video-btn:hover {
            background: #E2FF26;
            color: black;
        }
        
        .abstract-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 100px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Cinematic Intro Sequence -->
    <div id="intro-sequence">
        <img id="gbbo-logo" src="https://ic.c4assets.com/bips/10683838/08B3E439-97FF-4e5e-998b-cb45c11bf795.png?imformat=chrome" alt="GBBO Logo">
        <p id="enter-text">Click here to enter</p>
    </div>

    <!-- Video Overlay -->
    <div id="video-overlay" class="hidden">
        <div class="video-container">
            <!-- 20-second Fade to Black Screen with Button -->
            <div id="black-fade-screen">
                <button id="close-video-btn">Continue to Site</button>
            </div>
            
            <iframe id="intro-video" width="100%" height="100%" 
                src="https://drive.google.com/file/d/1Fb9ChUeBb8GPhjhE5Ij0XYGeQkLysrxI/preview" 
                frameborder="0" allow="autoplay; fullscreen" allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- Main App Container -->
    <div class="app-container">
        
        <!-- Abstract Icon decoration -->
        <svg class="abstract-icon" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="4">
            <path d="M 40 10 Q 10 10 10 40 Q 10 70 40 70 Q 70 70 70 40 Q 70 10 40 10 Z" />
            <path d="M 60 30 Q 30 30 30 60 Q 30 90 60 90 Q 90 90 90 60 Q 90 30 60 30 Z" />
        </svg>

        <main>
            <!-- Animated Baker Grid -->
            <section class="cast-wrapper">
                
                <!-- Curved Text SVG -->
                <svg class="neon-heading" viewBox="0 0 400 400">
                    <path id="curve" fill="transparent" d="M 70 200 A 130 130 0 0 1 330 140" />
                    <text font-family="'Segoe UI', sans-serif" font-size="40" fill="#E2FF26" font-weight="bold" letter-spacing="3">
                        <textPath href="#curve" startOffset="15%">The Bakers!</textPath>
                    </text>
                </svg>

                <div class="cast-grid" id="cast-grid">
                    <!-- 12 tiles to build the 4x3 image grid -->
                    <div class="cast-tile"></div>
                    <div class="cast-tile"></div>
                    <div class="cast-tile"></div>
                    <div class="cast-tile"></div>
                    <div class="cast-tile"></div>
                    <div class="cast-tile"></div>
                    <div class="cast-tile"></div>
                    <div class="cast-tile"></div>
                    <div class="cast-tile"></div>
                    <div class="cast-tile"></div>
                    <div class="cast-tile"></div>
                    <div class="cast-tile"></div>
                </div>
            </section>

            <!-- League Table -->
            <section class="leaderboard-section">
                <h2>League Table</h2>
                <table id="league-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Points</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        // --- Grid Animation Logic ---
        // This runs the stagger animation on the 12 tiles
        function animateGrid() {
            const tiles = document.querySelectorAll('.cast-tile');
            tiles.forEach((tile, index) => {
                // Adds a 150 millisecond delay between each square appearing
                setTimeout(() => {
                    tile.classList.add('visible');
                }, index * 150);
            });
        }

        // --- Intro Sequence & Video Timing Logic ---
        document.addEventListener("DOMContentLoaded", () => {
            const hasVisited = localStorage.getItem("gbbo_visited");
            
            const introSequence = document.getElementById("intro-sequence");
            const logo = document.getElementById("gbbo-logo");
            const enterText = document.getElementById("enter-text");
            
            const videoOverlay = document.getElementById("video-overlay");
            const blackFadeScreen = document.getElementById("black-fade-screen");
            const closeVideoBtn = document.getElementById("close-video-btn");
            const iframe = document.getElementById("intro-video");

            if (!hasVisited) {
                // 1. Wait 1 second, then fade in the logo
                setTimeout(() => {
                    logo.classList.add("fade-in");
                }, 1000);

                // 2. Wait an additional 2 seconds (3 seconds total), fade in "Click to enter"
                setTimeout(() => {
                    enterText.classList.add("fade-in");
                }, 3000);

                // 3. User clicks text -> Show Video, Start 20s Timer
                enterText.addEventListener("click", () => {
                    introSequence.classList.add("hidden");
                    videoOverlay.classList.remove("hidden");
                    
                    // Force autoplay via URL param if not present
                    const currentSrc = iframe.src;
                    if (!currentSrc.includes("autoplay=1")) {
                        iframe.src = currentSrc + "?autoplay=1";
                    }

                    // 4. Exactly 20 seconds later, fade to black and show button
                    setTimeout(() => {
                        blackFadeScreen.classList.add("active");
                    }, 20000); // 20 seconds
                });

                // 5. User clicks "Continue to Site" -> Enter actual website
                closeVideoBtn.addEventListener("click", () => {
                    videoOverlay.classList.add("hidden");
                    localStorage.setItem("gbbo_visited", "true"); 
                    iframe.src = ""; // Kill video background process
                    
                    // Trigger the grid fade-in effect now that they are on the site
                    setTimeout(animateGrid, 300); 
                });

            } else {
                // Skips intro completely on return visits
                introSequence.classList.add("hidden");
                videoOverlay.classList.add("hidden");
                
                // Animate grid immediately on page load
                setTimeout(animateGrid, 300);
            }

            renderLeaderboard();
        });

        // --- Mock Data & Points Config ---
        let players = [
            { name: "Alice", score: 12 },
            { name: "Bob", score: 8 },
            { name: "Charlie", score: 18 }
        ];

        // --- Leaderboard Rendering ---
        function renderLeaderboard() {
            const tbody = document.getElementById("leaderboard-body");
            tbody.innerHTML = "";

            players.sort((a, b) => b.score - a.score);

            players.forEach((player, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${player.name}</td>
                    <td>${player.score}</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
