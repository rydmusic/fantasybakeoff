<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy GBBO League</title>
    
    <style>
        /* --- GLOBAL THEME BASE (Referencing image_d13361.png) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #080C16; /* Dark navy background */
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- THE CIRCULAR FORM DESIGN --- */
        .form-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        /* Curved neon text overlay */
        .neon-heading {
            position: absolute;
            top: -40px;
            right: 15%;
            width: 400px;
            height: 400px;
            pointer-events: none;
            z-index: 10;
        }

        .circle-form {
            background-color: #352BFF; /* Bright blue circle */
            width: 450px;
            height: 450px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .circle-form form {
            width: 60%;
            display: flex;
            flex-direction: column;
        }

        /* Minimalist inputs */
        .circle-form label {
            font-size: 11px;
            color: #ffffff;
            margin-top: 15px;
            margin-bottom: 2px;
            text-transform: lowercase;
            letter-spacing: 1px;
        }

        .circle-form input, 
        .circle-form select {
            background: transparent;
            border: none;
            border-bottom: 1.5px solid #ffffff;
            color: #ffffff;
            font-size: 14px;
            padding: 5px 0;
            outline: none;
            appearance: none; /* Removes default dropdown arrow for cleaner look */
            cursor: pointer;
        }
        
        .circle-form input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .circle-form select option {
            background-color: #352BFF; /* Keeps dropdown legible */
            color: white;
        }

        /* Styled submit button matching the image offset outline */
        .circle-form button {
            margin-top: 30px;
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 25px;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        /* Creates the offset border effect seen in the image */
        .circle-form button::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 4px;
            right: -6px;
            bottom: -4px;
            border: 2px solid #ffffff;
            border-radius: 25px;
            pointer-events: none;
        }

        .circle-form button:hover {
            background-color: #ffffff;
            color: #352BFF;
        }

        /* --- LEADERBOARD REDESIGN (To fit the dark theme) --- */
        .leaderboard-section {
            width: 100%;
            max-width: 600px;
        }

        .leaderboard-section h2 {
            color: #E2FF26; /* Neon yellow-green accent */
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background-color: rgba(53, 43, 255, 0.3);
            color: #E2FF26;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* --- INTRO SEQUENCE & VIDEO OVERLAY --- */
        #intro-sequence {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 10001; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        #gbbo-logo {
            max-width: 80%;
            max-height: 50vh;
            opacity: 0; 
            transition: opacity 1.5s ease-in-out; 
        }

        #enter-text {
            color: #ffffff;
            font-size: 24px;
            margin-top: 40px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; 
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        #enter-text:hover {
            color: #E2FF26;
        }

        .fade-in {
            opacity: 1 !important;
        }

        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
        }

        .hidden {
            display: none !important;
        }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* The black screen that fades in over the video after 20s */
        #black-fade-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 10000;
            opacity: 0;
            pointer-events: none; /* Lets you click the video before it fades */
            transition: opacity 2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #black-fade-screen.active {
            opacity: 1;
            pointer-events: auto; /* Re-enables clicking for the button */
        }

        #close-video-btn {
            background: transparent;
            color: #E2FF26;
            border: 2px solid #E2FF26;
            padding: 15px 40px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        #close-video-btn:hover {
            background: #E2FF26;
            color: black;
        }
        
        /* White abstract icon decoration from image */
        .abstract-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 100px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Cinematic Intro Sequence -->
    <div id="intro-sequence">
        <img id="gbbo-logo" src="https://ic.c4assets.com/bips/10683838/08B3E439-97FF-4e5e-998b-cb45c11bf795.png?imformat=chrome" alt="GBBO Logo">
        <p id="enter-text">Click here to enter</p>
    </div>

    <!-- Video Overlay -->
    <div id="video-overlay" class="hidden">
        <div class="video-container">
            <!-- 20-second Fade to Black Screen with Button -->
            <div id="black-fade-screen">
                <button id="close-video-btn">Continue to Site</button>
            </div>
            
            <iframe id="intro-video" width="100%" height="100%" 
                src="https://drive.google.com/file/d/1Fb9ChUeBb8GPhjhE5Ij0XYGeQkLysrxI/preview" 
                frameborder="0" allow="autoplay; fullscreen" allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- Main App Container -->
    <div class="app-container">
        
        <!-- Abstract Icon decoration in top left matching image_d13361.png -->
        <svg class="abstract-icon" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="4">
            <path d="M 40 10 Q 10 10 10 40 Q 10 70 40 70 Q 70 70 70 40 Q 70 10 40 10 Z" />
            <path d="M 60 30 Q 30 30 30 60 Q 30 90 60 90 Q 90 90 90 60 Q 90 30 60 30 Z" />
        </svg>

        <main>
            <!-- Circular Prediction Form -->
            <section class="form-wrapper">
                
                <!-- Curved Text SVG matching the neon font from the image -->
                <svg class="neon-heading" viewBox="0 0 400 400">
                    <path id="curve" fill="transparent" d="M 70 200 A 130 130 0 0 1 330 140" />
                    <text font-family="'Segoe UI', sans-serif" font-size="42" fill="#E2FF26" font-weight="bold" letter-spacing="3">
                        <textPath href="#curve" startOffset="10%">Let's predict!</textPath>
                    </text>
                </svg>

                <div class="circle-form">
                    <form id="prediction-form">
                        <label for="player-name">անուն (Name)</label>
                        <input type="text" id="player-name" required>

                        <label for="technical">Technical Winner (3 pts)</label>
                        <select id="technical" required>
                            <option value="" disabled selected></option>
                            <option value="Baker 1">Baker 1</option>
                            <option value="Baker 2">Baker 2</option>
                            <option value="Baker 3">Baker 3</option>
                        </select>

                        <label for="star-baker">Star Baker (5 pts)</label>
                        <select id="star-baker" required>
                            <option value="" disabled selected></option>
                            <option value="Baker 1">Baker 1</option>
                            <option value="Baker 2">Baker 2</option>
                            <option value="Baker 3">Baker 3</option>
                        </select>

                        <label for="leaving">Who is leaving? (2 pts)</label>
                        <select id="leaving" required>
                            <option value="" disabled selected></option>
                            <option value="Baker 1">Baker 1</option>
                            <option value="Baker 2">Baker 2</option>
                            <option value="Baker 3">Baker 3</option>
                        </select>

                        <label for="handshake">Hollywood Handshake? (10 pts)</label>
                        <select id="handshake">
                            <option value="None" selected>None</option>
                            <option value="Baker 1">Baker 1</option>
                            <option value="Baker 2">Baker 2</option>
                            <option value="Baker 3">Baker 3</option>
                        </select>

                        <button type="submit">ուղարկել (Submit)</button>
                    </form>
                </div>
            </section>

            <!-- League Table -->
            <section class="leaderboard-section">
                <h2>League Table</h2>
                <table id="league-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Points</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        // --- Intro Sequence & Video Timing Logic ---
        document.addEventListener("DOMContentLoaded", () => {
            const hasVisited = localStorage.getItem("gbbo_visited");
            
            const introSequence = document.getElementById("intro-sequence");
            const logo = document.getElementById("gbbo-logo");
            const enterText = document.getElementById("enter-text");
            
            const videoOverlay = document.getElementById("video-overlay");
            const blackFadeScreen = document.getElementById("black-fade-screen");
            const closeVideoBtn = document.getElementById("close-video-btn");
            const iframe = document.getElementById("intro-video");

            if (!hasVisited) {
                // 1. Wait 1 second, then fade in the logo
                setTimeout(() => {
                    logo.classList.add("fade-in");
                }, 1000);

                // 2. Wait an additional 2 seconds (3 seconds total), fade in "Click to enter"
                setTimeout(() => {
                    enterText.classList.add("fade-in");
                }, 3000);

                // 3. User clicks text -> Show Video, Start 20s Timer
                enterText.addEventListener("click", () => {
                    introSequence.classList.add("hidden");
                    videoOverlay.classList.remove("hidden");
                    
                    // Force autoplay via URL param if not present
                    const currentSrc = iframe.src;
                    if (!currentSrc.includes("autoplay=1")) {
                        iframe.src = currentSrc + "?autoplay=1";
                    }

                    // 4. Exactly 20 seconds later, fade to black and show button
                    setTimeout(() => {
                        blackFadeScreen.classList.add("active");
                    }, 20000); // 20,000 milliseconds = 20 seconds
                });

                // 5. User clicks "Continue to Site" -> Enter actual website
                closeVideoBtn.addEventListener("click", () => {
                    videoOverlay.classList.add("hidden");
                    localStorage.setItem("gbbo_visited", "true"); 
                    iframe.src = ""; // Kill video background process
                });

            } else {
                // Skips intro completely on return visits
                introSequence.classList.add("hidden");
                videoOverlay.classList.add("hidden");
            }

            renderLeaderboard();
        });

        // --- Mock Data & Points Config ---
        const POINTS = {
            technical: 3,
            starBaker: 5,
            leaving: 2,
            handshake: 10
        };

        let players = [
            { name: "Alice", score: 12 },
            { name: "Bob", score: 8 },
            { name: "Charlie", score: 18 }
        ];

        // --- Form Submission Logic ---
        const form = document.getElementById("prediction-form");

        form.addEventListener("submit", (e) => {
            e.preventDefault();

            const playerName = document.getElementById("player-name").value;
            
            alert(`Predictions saved for ${playerName}!`);
            form.reset();
        });

        // --- Leaderboard Rendering ---
        function renderLeaderboard() {
            const tbody = document.getElementById("leaderboard-body");
            tbody.innerHTML = "";

            players.sort((a, b) => b.score - a.score);

            players.forEach((player, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${player.name}</td>
                    <td>${player.score}</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
